<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometri Krallığı | 5. Sınıf Matematik Macerası</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#101a38;color:#fff}button{font:inherit;cursor:pointer}#app{max-width:920px;margin:auto;padding:16px}header{text-align:center}h1{margin:8px 0;color:#ffe178;font-size:clamp(26px,5vw,43px)}.sub{color:#bcd6ff}.stats{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{background:#253b68;border:1px solid #516eaa;border-radius:20px;padding:8px 14px;font-weight:700}.world{position:relative;height:min(50vw,330px);min-height:230px;overflow:hidden;border:4px solid #648de0;border-radius:22px;background:linear-gradient(#5aabed 0%,#b5edff 67%,#71ba77 67%,#3c935d 100%);box-shadow:0 12px 40px #0005}.sun{position:absolute;right:10%;top:9%;width:56px;height:56px;border-radius:50%;background:#ffe788;box-shadow:0 0 35px #ffe788}.mountains{position:absolute;inset:22% 0 30%;background:#6689b3;clip-path:polygon(0 100%,16% 18%,33% 100%,53% 0,76% 100%,90% 35%,100% 100%)}.ground{position:absolute;bottom:0;height:33%;width:100%;background:linear-gradient(#65b64b,#378550)}.path{position:absolute;bottom:-20%;left:35%;width:40%;height:55%;background:#d6b479;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}.tree{position:absolute;bottom:24%;font-size:65px;filter:drop-shadow(2px 5px 2px #0004)}.castle{position:absolute;right:4%;bottom:24%;font-size:clamp(70px,15vw,140px);filter:drop-shadow(3px 8px 4px #0005)}.hero{position:absolute;bottom:15%;left:var(--hero-x,8%);font-size:clamp(48px,9vw,85px);transition:left .6s ease;filter:drop-shadow(3px 5px 2px #0006);animation:bob 1.4s infinite alternate}.flag{position:absolute;bottom:25%;font-size:clamp(30px,6vw,48px)}@keyframes bob{to{transform:translateY(-7px)}}.panel{margin-top:15px;background:#21345b;border:1px solid #536e9e;border-radius:18px;padding:20px;text-align:center}.panel h2{margin:4px 0 12px;color:#ffe178}.question{font-size:clamp(19px,3vw,26px);font-weight:750;margin:15px auto;max-width:650px}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.answer{background:#38578c;color:white;border:2px solid #7e9ad0;padding:14px;border-radius:12px;font-weight:700;min-height:60px}.answer:hover:not(:disabled){background:#4e73b3}.answer:disabled{cursor:default}.answer.correct{background:#16764d;border-color:#8af5a2}.answer.wrong{background:#a53a49;border-color:#ffb0b0}.primary{background:#ffcf45;color:#1c2850;border:0;border-radius:13px;padding:13px 25px;font-weight:850;margin-top:14px;box-shadow:0 4px #a67d18}.primary:hover{background:#ffe37d}.primary:active{transform:translateY(3px);box-shadow:0 1px #a67d18}.muted{color:#c8d9fb}.feedback{margin:14px 0 0;padding:12px;border-radius:12px;background:#152744}.progress{display:flex;gap:7px;margin-top:14px}.progress span{height:10px;border-radius:10px;background:#52648b;flex:1}.progress .done{background:#56dc87}.progress .active{background:#ffd455}.small{font-size:13px}.hide{display:none!important}footer{text-align:center;color:#adc6ee;font-size:12px;margin:18px 0}.stars{font-size:42px}.geometry{display:inline-flex;align-items:center;justify-content:center;min-width:80px;min-height:55px;font-size:42px;color:#ffdf76}button:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:500px){.world{min-height:220px}.panel{padding:14px}.tree{font-size:48px}.stats{font-size:13px}}
</style></head><body><main id="app"><header><div class="sub">🎮 ETKİLEŞİMLİ MATEMATİK MACERASI</div><h1>🏰 Geometri Krallığı</h1><div class="sub">5. Sınıf • Açılar ve Geometrik Şekiller</div></header><div class="stats"><span class="pill" id="stage">🌳 Bölüm 1 / 3</span><span class="pill" id="life">❤️❤️❤️</span><span class="pill" id="score">⭐ 0 Puan</span></div><div class="world" aria-label="Macera haritası"><div class="sun"></div><div class="mountains"></div><div class="ground"></div><div class="path"></div><span class="tree" style="left:3%">🌲</span><span class="tree" style="left:22%">🌳</span><span class="tree" style="left:44%">🌲</span><span class="castle">🏰</span><span class="flag" style="left:38%">🚩</span><span class="flag" style="left:62%">🚩</span><span class="hero" id="hero">🧙‍♂️</span></div><div class="progress" id="progress"><span class="active"></span><span></span><span></span></div><section class="panel" id="panel" aria-live="polite"></section><footer>İnternet bağlantısı gerektirmez • Ücretsiz • Telefon, tablet ve bilgisayarda oynanır</footer></main><script>
const levels=[{name:'Açılar Ormanı',icon:'🌳',intro:'Orman bekçisi yolunu kapattı! Açı sorularını çözerek sihirli geçidi aç.',questions:[['45° ölçüsündeki açı hangi türdür?',['Dar açı','Dik açı','Geniş açı'],0,'45°, 0° ile 90° arasında olduğu için dar açıdır.','∠'],['Dik açının ölçüsü kaç derecedir?',['45°','90°','180°'],1,'Dik açı 90° ölçüsündedir.','📐'],['120° ölçüsündeki açı hangi türdür?',['Dar açı','Geniş açı','Doğru açı'],1,'90° ile 180° arasındaki açılar geniş açıdır.','∠'],['Doğru açının ölçüsü kaç derecedir?',['90°','180°','360°'],1,'Doğru açı 180° ölçüsündedir.','📏']]},{name:'Çokgenler Köprüsü',icon:'🌉',intro:'Büyülü köprünün taşları kayıp! Çokgen sorularıyla köprüyü tamamla.',questions:[['Bir üçgenin kaç köşesi vardır?',['3','4','5'],0,'Üçgenin 3 köşesi ve 3 kenarı vardır.','△'],['Hangisi çokgen değildir?',['Beşgen','Çember','Altıgen'],1,'Çember doğru parçalarından oluşmaz.','◯'],['Altıgenin kaç kenarı vardır?',['5','6','8'],1,'Altıgenin 6 kenarı vardır.','⬡'],['Bir dörtgenin kaç köşegeni vardır?',['1','2','4'],1,'Dörtgende karşılıklı köşeleri birleştiren 2 köşegen bulunur.','◇']]},{name:'Şekiller Kalesi',icon:'🏰',intro:'Son kapı! Geometrik şekilleri tanı, krallığın anahtarını kazan.',questions:[['Dört kenarı eşit ve dört açısı dik olan şekil hangisidir?',['Dikdörtgen','Kare','Üçgen'],1,'Karenin 4 eşit kenarı ve 4 dik açısı vardır.','□'],['Eşkenar üçgenin bir iç açısı kaç derecedir?',['45°','60°','90°'],1,'Eşkenar üçgenin her iç açısı 60°dir.','△'],['Dikdörtgenin kaç dik açısı vardır?',['2','3','4'],2,'Dikdörtgenin bütün iç açıları 90°dir.','▭'],['Hangi şeklin beş kenarı vardır?',['Beşgen','Altıgen','Sekizgen'],0,'Beşgenin 5 kenarı ve 5 köşesi vardır.','⬠']]}];
let level=0,qi=0,lives=3,score=0,answered=false;const panel=document.getElementById('panel');function update(){document.getElementById('stage').textContent=levels[level].icon+' Bölüm '+(level+1)+' / 3';document.getElementById('life').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);document.getElementById('score').textContent='⭐ '+score+' Puan';document.getElementById('hero').style.setProperty('--hero-x',(8+(level*4+qi)*6.5)+'%');document.getElementById('progress').innerHTML=levels.map((_,i)=>'<span class="'+(i<level?'done':i===level?'active':'')+'"></span>').join('')}
function start(){level=0;qi=0;lives=3;score=0;update();intro()}function intro(){update();panel.innerHTML='<div class="stars">'+levels[level].icon+'</div><h2>Bölüm '+(level+1)+': '+levels[level].name+'</h2><p>'+levels[level].intro+'</p><p class="muted">4 soruyu cevapla. Her doğru cevap +100 puan! Bölüm başına 3 canın var.</p><button class="primary" id="go">🚀 Bölüme Başla</button>';document.getElementById('go').onclick=question}
function question(){answered=false;update();const q=levels[level].questions[qi];panel.innerHTML='<div class="small muted">SORU '+(qi+1)+' / 4</div><div class="geometry" aria-hidden="true">'+q[4]+'</div><div class="question">'+q[0]+'</div><div class="answers" id="answers"></div><div id="feedback"></div>';const wrap=document.getElementById('answers');q[1].forEach((option,i)=>{const b=document.createElement('button');b.className='answer';b.textContent='ABC'[i]+') '+option;b.onclick=()=>choose(i);wrap.appendChild(b)})}
function choose(i){if(answered)return;answered=true;const q=levels[level].questions[qi],correct=i===q[2];if(correct)score+=100;else lives--;update();[...document.querySelectorAll('.answer')].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const fb=document.getElementById('feedback');fb.innerHTML='<div class="feedback"><strong>'+(correct?'🎉 Harika! +100 puan':'💡 Bu kez olmadı!')+'</strong><p>'+q[3]+'</p></div><button class="primary" id="next">'+(lives===0?'Sonucu Gör':qi===3?(level===2?'🏆 Macerayı Bitir':'➡️ Sonraki Bölüm'):'➡️ İlerle')+'</button>';document.getElementById('next').onclick=next}
function next(){if(lives===0){end(false);return}if(qi<3){qi++;question()}else if(level<2){level++;qi=0;lives=3;intro()}else end(true)}function end(won){update();panel.innerHTML='<div class="stars">'+(won?'🏆🎉':'💔')+'</div><h2>'+(won?'Geometri Krallığı Kurtarıldı!':'Macera Burada Bitti')+'</h2><p>'+(won?'Tebrikler Geometri Kahramanı! Üç bölümü tamamladın.':'Canların tükendi. Tekrar deneyerek bütün kapıları açabilirsin.')+'</p><h2>⭐ '+score+' Puan</h2><button class="primary" id="restart">🔄 Yeniden Oyna</button>';document.getElementById('restart').onclick=start}
panel.innerHTML='<div class="stars">🧙‍♂️✨🏰</div><h2>Macera Seni Bekliyor!</h2><p>Üç büyülü bölgeyi keşfet, açıları ve şekilleri tanı, Geometri Krallığı’nı kurtar!</p><p class="muted">12 soru • 3 bölüm • Can ve puan sistemi</p><button class="primary" id="start">▶️ MACERAYA BAŞLA</button>';document.getElementById('start').onclick=start;
</script></body></html>
